# Local SQL Server 2022 for development. Put MDS_EPD_SQL16.mdf in infra/mssql/data/
# (git-ignored), then run infra/mssql/attach.sh once.
name: db-intelligence

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - '1433:1433'
    volumes:
      - mssql-system:/var/opt/mssql
      - ./mssql/data:/var/opt/mssql/userdata
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    env_file: ../.env
    environment:
      DB_HOST: mssql
    ports:
      - '3000:3000'
    depends_on:
      mssql:
        condition: service_healthy

volumes:
  mssql-system:
